<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>汽车销量动态排行</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      font-family: "Segoe UI", sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .container {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      padding: 16px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin: 0 0 0 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 10px;
    }

    .controls select, .controls button {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(255,255,255,0.1);
    }

    .controls select:hover,
    .controls button:hover {
      background-color: #444;
    }

    .controls button:active {
      transform: scale(0.95);
    }

    .chart-wrapper {
      display: flex;
      gap: 20px;
      flex-grow: 1;
      overflow: auto;
      padding: 10px;
    }

    .chart-box {
      flex: 1;
      height: 100%;
      background: #1d1d1d;
      border-radius: 10px;
      padding: 10px;
      box-sizing: border-box;
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1d1d1d;
    }

    ::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h2 class="title" id="main-title">汽车销量动态排行榜</h2>
      <div class="controls">
        <label style="font-size: 14px;">车型类别：</label>
        <select id="typeSelect">
          <option value="all">全部</option>
          <option value="jiaoche">轿车</option>
          <option value="suv">SUV</option>
          <option value="mpv">MPV</option>
          <option value="xinnengyuan">新能源</option>
        </select>
        <label style="font-size: 14px;">月份：</label>
        <select id="monthSelect">
          <option value="01">1月</option>
          <option value="02">2月</option>
          <option value="03">3月</option>
          <option value="04">4月</option>
          <option value="05">5月</option>
          <option value="06">6月</option>
        </select>
        <button onclick="togglePlay()"><span id="playText">▶️ 播放</span></button>
      </div>
    </div>

    <div class="chart-wrapper">
      <div class="chart-box" id="barChart"></div>
      <div class="chart-box" id="roseChart"></div>
    </div>
  </div>

  <script>
    let barChart = echarts.init(document.getElementById('barChart'));
    let roseChart = echarts.init(document.getElementById('roseChart'));
    let timer = null;
    let isPlaying = false;
    let chartData = [];
    let selectedMonth = '01';
    let selectedType = 'all';
    const monthList = ['01', '02', '03', '04', '05', '06'];
    let monthIndex = 0;

    const colors = [
      '#ff7f50', '#87cefa', '#da70d6', '#32cd32', '#6495ed',
      '#ff69b4', '#ba55d3', '#cd5c5c', '#ffa500', '#40e0d0'
    ];

    const typeMap = {
      'all': '全部车型',
      'jiaoche': '轿车',
      'suv': 'SUV',
      'mpv': 'MPV',
      'xinnengyuan': '新能源'
    };

    async function fetchData(type, month) {
      const res = await fetch(`/data/getCarSalesByMonthAndType?type=${type}&month=${month}`);
      const data = await res.json();
      chartData = data.slice(0, 10).map((d, i) => ({
        name: d.car_name,
        value: parseInt(d.sales) || 0,
        itemStyle: { color: colors[i % colors.length] }
      }));
      selectedMonth = month;
      selectedType = type;
      monthIndex = monthList.indexOf(month);
      document.getElementById('monthSelect').value = month;
      document.getElementById('typeSelect').value = type;
      updateTitle(type, month);
      renderCharts(chartData);
    }

    function updateTitle(type, month) {
      const monthMap = {
        '01': '1月', '02': '2月', '03': '3月', '04': '4月', '05': '5月', '06': '6月'
      };
      document.getElementById('main-title').innerText = `2025年${monthMap[month]} ${typeMap[type]} Top10 销量车型`;
    }

    function renderCharts(data) {
      const names = data.map(d => d.name);
      const values = data.map(d => d.value);

      // 柱状图
      barChart.setOption({
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'shadow' },
          formatter: params => {
            const item = params[0];
            return `${item.name}<br/>销量：${item.value}`;
          }
        },
        xAxis: {
          type: 'category',
          data: names,
          axisLabel: { color: '#ccc', rotate: 20, interval: 0 },
          axisLine: { lineStyle: { color: '#888' } }
        },
        yAxis: {
          type: 'value',
          axisLabel: { color: '#ccc' },
          splitLine: { lineStyle: { color: '#333' } }
        },
        grid: { left: '6%', right: '4%', bottom: '12%', top: '10%', containLabel: true },
        series: [{
          name: '销量',
          type: 'bar',
          data: values,
          itemStyle: {
            color: function(params) {
              return colors[params.dataIndex % colors.length];
            }
          },
          barWidth: '40%',
          animationDuration: 800,
          universalTransition: true
        }]
      });

      // 玫瑰图
      roseChart.setOption({
        title: {
          text: `${selectedMonth}月\n${typeMap[selectedType]}`,
          left: 'center',
          top: '32%',
          textStyle: {
            color: '#fff',
            fontSize: 16,
            fontWeight: 'bold',
            align: 'center',
            lineHeight: 24
          }
        },
        tooltip: {
          trigger: 'item',
          formatter: params => {
            return `${params.name}<br/>销量：${params.value} 辆<br/>占比：${params.percent}%`;
          }
        },
        legend: {
          bottom: 0,
          textStyle: { color: '#fff', fontSize: 12 }
        },
        series: [{
          name: '销量占比',
          type: 'pie',
          radius: ['30%', '70%'],
          center: ['50%', '40%'],
          roseType: 'radius',
          data: data,
          label: {
            color: '#fff',
            formatter: '{b}: {d}%'
          },
          universalTransition: true
        }]
      });
    }

    function nextMonth() {
      monthIndex = (monthIndex + 1) % monthList.length;
      const next = monthList[monthIndex];
      fetchData(selectedType, next);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playText').innerText = isPlaying ? '⏸️ 暂停' : '▶️ 播放';
      if (isPlaying) {
        nextMonth();
        timer = setInterval(() => nextMonth(), 3000);
      } else {
        clearInterval(timer);
      }
    }

    document.getElementById('monthSelect').addEventListener('change', e => {
      clearInterval(timer);
      isPlaying = false;
      document.getElementById('playText').innerText = '▶️ 播放';
      fetchData(selectedType, e.target.value);
    });

    document.getElementById('typeSelect').addEventListener('change', e => {
      clearInterval(timer);
      isPlaying = false;
      document.getElementById('playText').innerText = '▶️ 播放';
      fetchData(e.target.value, selectedMonth);
    });

    fetchData(selectedType, selectedMonth);
  </script>
</body>
</html>
